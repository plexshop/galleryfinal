<!doctype html>
<html lang="en">
<head>
<title>JS Gallery Homework</title>
<style>
  #image {
    width: 500px;
    height: 300px;
    border: 2px solid #333;
    background-size: cover;
    background-position: center;
    text-align: center;
    line-height: 300px;
    font-weight: bold;
  }
  .preview {
    width: 120px;
    height: 80px;
    margin: 5px;
    cursor: pointer;
  }
</style>
<script>
function upDate(previewPic) {
    console.log("upDate triggered for: " + previewPic.alt);
    document.getElementById("image").innerHTML = previewPic.alt;
    document.getElementById("image").style.backgroundImage = "url('" + previewPic.src + "')";
}

function undo() {
    console.log("undo triggered");
    document.getElementById("image").innerHTML = "Hover over an image below to display here.";
    document.getElementById("image").style.backgroundImage = "url('')";
}

// Handle focus (keyboard navigation)
function focusImage(previewPic) {
    console.log("focus triggered for: " + previewPic.alt);
    document.getElementById("image").innerHTML = previewPic.alt;
    document.getElementById("image").style.backgroundImage = "url('" + previewPic.src + "')";
}

// Handle blur (when focus leaves)
function blurImage() {
    console.log("blur triggered");
    document.getElementById("image").innerHTML = "Hover over an image below to display here.";
    document.getElementById("image").style.backgroundImage = "url('')";
}

// On page load, add tabindex dynamically
function addTabIndex() {
    console.log("Page loaded - adding tabindex attributes");
    let previews = document.querySelectorAll(".preview");
    for (let i = 0; i < previews.length; i++) {
        previews[i].setAttribute("tabindex", "0");
        previews[i].addEventListener("focus", function() { focusImage(previews[i]); });
        previews[i].addEventListener("blur", blurImage);
    }
}
</script>
</head>
<body onload="addTabIndex()">
  <div id="image">Hover over an image below to display here.</div>
  
  <!-- Thumbnails from Unsplash -->
  <img class="preview" 
       src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500" 
       alt="Mountain Landscape" 
       onmouseover="upDate(this)" 
       onmouseout="undo()">

  <img class="preview" 
       src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" 
       alt="Ocean Waves" 
       onmouseover="upDate(this)" 
       onmouseout="undo()">

  <img class="preview" 
       src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500" 
       alt="Forest Path" 
       onmouseover="upDate(this)" 
       onmouseout="undo()">

  <img class="preview" 
       src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" 
       alt="City Skyline" 
       onmouseover="upDate(this)" 
       onmouseout="undo()">

  <img class="preview" 
       src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=500" 
       alt="Cute Kitten" 
       onmouseover="upDate(this)" 
       onmouseout="undo()">

  <img class="preview" 
       src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500" 
       alt="Smiling Friends" 
       onmouseover="upDate(this)" 
       onmouseout="undo()">
</body>
</html>
